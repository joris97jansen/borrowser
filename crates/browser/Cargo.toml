[package]
name = "browser"
version = "0.1.0"
edition = "2024"

[features]
conformance-observation = []

[dependencies]
addressing = { path = "../addressing" }
app_api = { path = "../app_api" }
bus = { path = "../bus" }
net = { path = "../net" }
html = { path = "../html", features = ["internal-api"] }
css = { path = "../css" }
core_types = { path = "../core_types" }
tools = { path = "../tools" }
layout = { path = "../layout" }
gfx = { path = "../gfx" }
input_core = { path = "../input_core" }

egui = { workspace = true }
url = { workspace = true }
image = { workspace = true }

[dev-dependencies]
html = { path = "../html", features = ["dom-snapshot", "test-harness", "html5"] }
runtime_css = { path = "../runtime_css" }
runtime_net = { path = "../runtime_net" }
runtime_parse = { path = "../runtime_parse" }
log = "0.4"
rustls = { version = "0.23.32", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"

[[example]]
name = "ai5_abort_probe"
required-features = ["conformance-observation"]
