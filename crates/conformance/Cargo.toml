[package]
name = "borrowser-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Live acceptance is additionally ignored and requires explicit operator inputs.
aws-acceptance = []

[dependencies]
browser = { path = "../browser" }
bus = { path = "../bus" }
core_types = { path = "../core_types" }
runtime_parse = { path = "../runtime_parse" }
egui = { workspace = true }
base64 = "0.22.1"
libc = "0.2.175"
png = "0.18.0"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
sha2 = "=0.10.9"
getrandom = "=0.3.3"
