[package]
name = "conformance-runner"
version = "0.1.0"
edition = "2024"
default-run = "conformance-runner"

[features]
default = []
external-capture = ["dep:external-browser-capture", "external-browser-capture/chromium-cdp"]
html-parser = ["dep:html-test-support"]
css = ["dep:css-test-support"]
rendering = ["dep:rendering-test-support"]
aggregate = ["html-parser", "css", "rendering", "dep:serde", "dep:toml"]

[dependencies]
external-browser-capture = { path = "../external_browser_capture", optional = true }
conformance-test-support = { path = "../conformance_test_support" }
html-test-support = { path = "../html_test_support", features = ["parser-fixtures"], optional = true }
css-test-support = { path = "../css_test_support", optional = true }
rendering-test-support = { path = "../rendering_test_support", optional = true }
external-test-provenance = { path = "../external_test_provenance" }
serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "0.9", features = ["parse", "serde"], optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lib]
name = "conformance_runner"
path = "src/lib.rs"

[[bin]]
name = "conformance-runner"
path = "src/bin/conformance_runner.rs"

[[bin]]
name = "conformance-capture"
path = "src/bin/conformance_capture.rs"
required-features = ["external-capture"]
