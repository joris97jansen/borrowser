format = "borrowser-paired-rendering-fixture-v1"
id = "paint-reference-equivalent-cascade"
profiles = ["paint-operations"]

[test]
html = "test.html"
stylesheets = [
  { path = "test-base.css", origin = "author", order = 0, source = 0 },
  { path = "test-override.css", origin = "author", order = 1, source = 1 },
]

[reference]
html = "reference.html"
stylesheets = [{ path = "reference.css", origin = "author", order = 0, source = 0 }]

[[variants]]
environment = "synthetic-text-metrics-v1"
available_width_css_px = 320
