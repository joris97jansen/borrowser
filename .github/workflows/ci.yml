  ci_qualification:
    name: CI qualification
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    needs:
      - source_provenance
      - rust_correctness
      - rust_release
      - rust_conformance
      - streaming_integration
      - streaming_head
      - ag2_linux_chromium
      - ag4_nonbillable
      - html5_tokenizer_fuzz_smoke
      - html5_tokenizer_script_data_fuzz_smoke
      - html5_tokenizer_rawtext_fuzz_smoke
      - html5_tokenizer_rcdata_fuzz_smoke
      - html5_tree_builder_token_fuzz_smoke
      - html5_pipeline_fuzz_smoke
      - css_fuzz_regressions
      - css_syntax_fuzz_smoke
      - css_pipeline_fuzz_smoke
    steps:
      - name: Require every qualification job to succeed
        env:
          QUALIFICATION_RESULTS: ${{ toJSON(needs) }}
          INTEGRATION_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I -B - <<'PY'
          import json
          import os
          import re
          import sys

          expected = {
              'source_provenance',
              'rust_correctness',
              'rust_release',
              'rust_conformance',
              'streaming_integration',
              'streaming_head',
              'ag2_linux_chromium',
              'ag4_nonbillable',
              'html5_tokenizer_fuzz_smoke',
              'html5_tokenizer_script_data_fuzz_smoke',
              'html5_tokenizer_rawtext_fuzz_smoke',
              'html5_tokenizer_rcdata_fuzz_smoke',
              'html5_tree_builder_token_fuzz_smoke',
              'html5_pipeline_fuzz_smoke',
              'css_fuzz_regressions',
              'css_syntax_fuzz_smoke',
              'css_pipeline_fuzz_smoke',
          }
          source_jobs = {"source_provenance", "rust_correctness", "rust_release", "rust_conformance", "streaming_integration"}
          try:
              results = json.loads(os.environ["QUALIFICATION_RESULTS"])
              if not isinstance(results, dict) or set(results) != expected:
                  raise ValueError("missing or unexpected qualification prerequisites")
              event = os.environ["GITHUB_EVENT_NAME"]
              if event not in ("pull_request", "push"):
                  raise ValueError("unsupported qualification event")
              pull_request = event == "pull_request"
              for name in sorted(expected):
                  wanted = "skipped" if name == "streaming_head" and not pull_request else "success"
                  if not isinstance(results[name], dict) or results[name].get("result") != wanted:
                      raise ValueError("qualification did not succeed: " + name)
              integration = os.environ["INTEGRATION_SHA"]
              provenance = results["source_provenance"]["outputs"]
              tree = provenance["qualified_tree"]
              if not re.fullmatch(r"[0-9a-f]{40}", integration) or not re.fullmatch(r"[0-9a-f]{40}", tree):
                  raise ValueError("missing integration source identity")
              for name in sorted(source_jobs):
                  outputs = results[name]["outputs"]
                  if outputs.get("qualified_sha") != integration or outputs.get("qualified_tree") != tree:
                      raise ValueError("integration source qualification is missing or mismatched: " + name)
              head = results["streaming_head"].get("outputs", {})
              if pull_request:
                  sha = os.environ["PR_HEAD_SHA"]
                  head_tree = provenance["pr_head_tree"]
                  if not re.fullmatch(r"[0-9a-f]{40}", sha) or not re.fullmatch(r"[0-9a-f]{40}", head_tree):
                      raise ValueError("missing PR head source identity")
                  if head.get("qualified_sha") != sha or head.get("qualified_tree") != head_tree:
                      raise ValueError("exact PR head guard qualification is missing or mismatched")
              elif head:
                  raise ValueError("master push must not fabricate PR-head qualification")
          except (KeyError, ValueError, TypeError, AttributeError) as error:
              sys.exit(str(error))
          print("Every qualification succeeded for its required source context.")
          PY

  rust:
    # Keep the already-required context as the final fail-closed migration barrier.
    name: Rust (ubuntu-latest)
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    needs:
      - ci_qualification
    steps:
      - name: Preserve required Rust status
        env:
          QUALIFICATION_RESULT: ${{ needs.ci_qualification.result }}
        run: |
          set -euo pipefail
          test "$QUALIFICATION_RESULT" = success
