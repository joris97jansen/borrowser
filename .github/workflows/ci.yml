  streaming_integration:
    name: Streaming guard (integration)
    if: ${{ !startsWith(github.ref, 'refs/heads/qualification/ag4-native-proxy-timing-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RUST_BACKTRACE: 1
    outputs:
      qualified_sha: ${{ steps.qualification_source.outputs.qualified_sha }}
      qualified_tree: ${{ steps.qualification_source.outputs.qualified_tree }}
    steps:
      - *integration_checkout
      - *integration_identity
      - *committed_preflight
      - *rust_dependencies
      - *pinned_toolchain
      - name: Cache cargo (streaming-integration-debug)
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-ci-1458
          key: streaming-integration-debug
          cache-targets: 'true'
          cache-workspace-crates: 'false'
          cache-bin: 'false'
          cache-on-failure: 'false'
      - name: Record native streaming guard lane equivalence
        timeout-minutes: 10
        run: |
          python3 -I -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          evidence = Path(os.environ["RUNNER_TEMP"]) / "ci-1458-evidence"
          evidence.mkdir(exist_ok=True)
          manifest = tomllib.loads(Path("crates/runtime_parse/Cargo.toml").read_text())
          if manifest["package"]["name"] != "runtime_parse":
              raise SystemExit("streaming guard package identity mismatch")
          if any(t.get("name") == "perf_regression" and t.get("harness", True) is not True for t in manifest.get("test", [])):
              raise SystemExit("streaming guard requires the standard libtest harness")
          records = []
          configurations = {}
          for lane, features in (("default", []), ("html5", ["--features", "html5"]), ("narrow", [])):
              targets = ["--test", "perf_regression"] if lane == "narrow" else ["--lib", "--bins", "--tests", "--examples"]
              command = ["cargo", "test", "--workspace", *targets, "--locked", "--no-run", "--message-format=json", "--timings", *features]
              with (evidence / (lane + ".jsonl")).open("w") as output:
                  subprocess.run(command, stdout=output, check=True)
              artifacts = [json.loads(line) for line in (evidence / (lane + ".jsonl")).read_text().splitlines()]
              guards = [a for a in artifacts if a.get("reason") == "compiler-artifact"
                        and a["target"]["name"] == "perf_regression"
                        and Path(a["manifest_path"]).resolve() == Path("crates/runtime_parse/Cargo.toml").resolve()
                        and a["target"]["kind"] == ["test"]
                        and Path(a["target"]["src_path"]).resolve() == Path("crates/runtime_parse/tests/perf_regression.rs").resolve()
                        and a["profile"]["test"] and a.get("executable")]
              if len(guards) != 1:
                  raise SystemExit(f"{lane}: expected exactly one streaming guard artifact")
              guard = guards[0]
              configurations[lane] = {json.dumps({key: a[key] for key in ("package_id", "target", "profile", "features")}, sort_keys=True)
                                      for a in artifacts if a.get("reason") == "compiler-artifact"}
              records.append({"lane": lane, "command": command, "artifact": guard,
                              "sha256": hashlib.sha256(Path(guard["executable"]).read_bytes()).hexdigest()})
          report = {"executed_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "executed_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                    "rustc": subprocess.check_output(["rustc", "-vV"], text=True),
                    "cargo": subprocess.check_output(["cargo", "-vV"], text=True),
                    "compiler_environment": {name: os.environ.get(name) for name in
                        ("RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_INCREMENTAL", "CARGO_BUILD_TARGET")},
                    "lanes": records,
                    "same_guard_bytes": records[0]["sha256"] == records[1]["sha256"],
                    "configuration_counts": {lane: len(values) for lane, values in configurations.items()},
                    "same_workspace_configurations": configurations["default"] == configurations["html5"],
                    "narrow_configuration_subset": configurations["narrow"] <= configurations["default"],
                    "narrow_guard_bytes_equal": records[0]["sha256"] == records[2]["sha256"]}
          (evidence / "lane-equivalence.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          # An unequal result is evidence against deduplication, not permission to skip a lane.
          PY
      - name: Audit streaming guard replacement inventories
        timeout-minutes: 3
        run: |
          python3 -I -B - <<'PYTHON'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import subprocess

          evidence = Path(os.environ["RUNNER_TEMP"]) / "ci-1458-evidence"
          expected = "runtime_parse_linear_streaming_guard: test"
          records = []
          for lane, features in (("default", []), ("html5", ["--features", "html5"])):
              command = ["cargo", "test", "--workspace", "--lib", "--bins", "--tests", "--examples", "--locked", *features,
                         "--", "--skip", "aws::command::tests::native_procfs_", "--list", "--format", "terse"]
              before = subprocess.check_output(command, text=True)
              after = subprocess.check_output(command + ["--skip", "runtime_parse_linear_streaming_guard"], text=True)
              original = Counter(before.splitlines())
              replacement = Counter(after.splitlines())
              if original[expected] != 1 or replacement[expected] != 0 or replacement - original or original - replacement != Counter({expected: 1}):
                  raise SystemExit(f"{lane}: replacement must remove exactly the qualified guard and no other test")
              (evidence / (lane + "-inventory.txt")).write_text(before)
              (evidence / (lane + "-replacement-inventory.txt")).write_text(after)
              records.append({"lane": lane, "command": command, "before_records": sum(original.values()),
                              "after_records": sum(replacement.values()), "removed": [expected]})
          (evidence / "replacement-inventory.json").write_text(json.dumps(records, indent=2) + "\n")
          # This is a proof-only listing. Both original workspace execution commands remain intact.
          PYTHON
      - name: Qualify streaming guard on integration source
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          root=$PWD
          evidence="$RUNNER_TEMP/ci-1458-evidence"
          # Listing may invoke Cargo; bind and hash the artifact after it completes.
          cargo test --workspace --lib --bins --tests --examples --locked \
            runtime_parse_linear_streaming_guard -- --exact --list --format terse > "$evidence/integration-workspace-selection.txt"
          test "$(cat "$evidence/integration-workspace-selection.txt")" = 'runtime_parse_linear_streaming_guard: test'
          python3 -I -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          root = Path.cwd().resolve()
          evidence = Path(os.environ["RUNNER_TEMP"]) / "ci-1458-evidence"
          manifest = root / "crates/runtime_parse/Cargo.toml"
          manifest_data = tomllib.loads(manifest.read_text())
          if manifest_data["package"]["name"] != "runtime_parse":
              raise SystemExit("streaming guard package identity mismatch")
          # Cargo's profile.test can also be true for a harness=false executable.
          if any(target.get("name") == "perf_regression" and target.get("harness", True) is not True
                 for target in manifest_data.get("test", [])):
              raise SystemExit("streaming guard requires the standard libtest harness")
          artifacts = [json.loads(line) for line in (evidence / "default.jsonl").read_text().splitlines()]
          guards = [a for a in artifacts if a.get("reason") == "compiler-artifact"
                    and Path(a["manifest_path"]).resolve() == manifest
                    and a["target"]["name"] == "perf_regression"
                    and a["target"]["kind"] == ["test"]
                    and Path(a["target"]["src_path"]).resolve() == root / "crates/runtime_parse/tests/perf_regression.rs"
                    and a["profile"]["test"] and a.get("executable")]
          if len(guards) != 1:
              raise SystemExit("expected one runtime_parse/perf_regression integration-test artifact")
          executable = Path(guards[0]["executable"]).resolve()
          if not executable.is_file() or not executable.is_relative_to((root / "target").resolve()):
              raise SystemExit("streaming guard executable is outside the job target directory")
          (evidence / "integration-guard-executable.txt").write_text(str(executable) + "\n")
          (evidence / "integration-guard-artifact.json").write_text(json.dumps(
              {"artifact": guards[0], "sha256": hashlib.sha256(executable.read_bytes()).hexdigest()}, indent=2) + "\n")
          # Reject an overwritten artifact after the narrower-recipe probe.
          report = json.loads((evidence / "lane-equivalence.json").read_text())
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          if report["executed_sha"] != os.environ["GITHUB_SHA"] or report["executed_tree"] != tree:
              raise SystemExit("streaming evidence source identity changed")
          if hashlib.sha256(executable.read_bytes()).hexdigest() != report["lanes"][0]["sha256"]:
              raise SystemExit("qualified full-workspace guard artifact changed")
          PY
          guard=$(cat "$evidence/integration-guard-executable.txt")
          cd crates/runtime_parse
          "$guard" runtime_parse_linear_streaming_guard --exact --list --format terse > "$evidence/integration-target-selection.txt"
          test "$(cat "$evidence/integration-target-selection.txt")" = 'runtime_parse_linear_streaming_guard: test'
          "$guard" runtime_parse_linear_streaming_guard --exact --nocapture --format pretty --color never \
            2>&1 | tee "$evidence/integration-guard.log"
          grep -Fx 'test runtime_parse_linear_streaming_guard ... ok' "$evidence/integration-guard.log"
          test "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s$' "$evidence/integration-guard.log")" = 1
          cd "$root"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - *source_complete
      - name: Retain streaming qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-1458-integration-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ci-1458-evidence/
            target/cargo-timings/
            ${{ runner.temp }}/ci-1458-pr-head-target/cargo-timings/
          retention-days: 14

  streaming_head:
    name: Streaming guard (exact PR head)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RUST_BACKTRACE: 1
    outputs:
      qualified_sha: ${{ steps.pr_head_guard.outputs.head_sha }}
      qualified_tree: ${{ steps.qualification_source.outputs.pr_head_tree }}
    steps:
      - *integration_checkout
      - *integration_identity
      - *committed_preflight
      - *rust_dependencies
      - *pinned_toolchain
      - name: Cache cargo (head-registry)
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-ci-1458
          key: head-registry
          cache-targets: 'false'
          cache-workspace-crates: 'false'
          cache-bin: 'false'
          cache-on-failure: 'false'
      - name: Qualify streaming guard on exact PR head
        id: pr_head_guard
        if: github.event_name == 'pull_request'
        timeout-minutes: 20
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export evidence="$RUNNER_TEMP/ci-1458-evidence"
          export head_dir="$RUNNER_TEMP/ci-1458-pr-head"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ci-1458-pr-head-target"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          # Preparation includes checkout, compilation, workspace selection and artifact binding.
          timeout --kill-after=10s 10m bash -euo pipefail <<'PREPARE'
          phase_started=$SECONDS
          git cat-file -e "$PR_HEAD_SHA^{commit}"
          git worktree add --detach "$head_dir" "$PR_HEAD_SHA"
          cd "$head_dir"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git show -s --format='head_commit=%H head_tree=%T parents=%P' HEAD | tee "$evidence/pr-head-source.txt"
          echo "worktree_and_identity_seconds=$((SECONDS - phase_started))" >> "$evidence/pr-head-timings.txt"
          # Keep workspace feature unification. Do not substitute an unqualified -p build.
          phase_started=$SECONDS
          cargo test --workspace --lib --bins --tests --examples --locked \
            --no-run --message-format=json --timings > "$evidence/pr-head-artifacts.jsonl"
          echo "compilation_seconds=$((SECONDS - phase_started))" >> "$evidence/pr-head-timings.txt"
          phase_started=$SECONDS
          cargo test --workspace --lib --bins --tests --examples --locked \
            runtime_parse_linear_streaming_guard -- --exact --list --format terse \
            > "$evidence/pr-head-selection.txt"
          test "$(cat "$evidence/pr-head-selection.txt")" = 'runtime_parse_linear_streaming_guard: test'
          echo "workspace_selection_seconds=$((SECONDS - phase_started))" >> "$evidence/pr-head-timings.txt"
          phase_started=$SECONDS
          python3 -I -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tomllib

          root = Path(os.environ["head_dir"]).resolve()
          evidence = Path(os.environ["evidence"])
          manifest = root / "crates/runtime_parse/Cargo.toml"
          manifest_data = tomllib.loads(manifest.read_text())
          if manifest_data["package"]["name"] != "runtime_parse":
              raise SystemExit("streaming guard package identity mismatch")
          # Cargo's profile.test can also be true for a harness=false executable.
          if any(target.get("name") == "perf_regression" and target.get("harness", True) is not True
                 for target in manifest_data.get("test", [])):
              raise SystemExit("streaming guard requires the standard libtest harness")
          artifacts = [json.loads(line) for line in (evidence / "pr-head-artifacts.jsonl").read_text().splitlines()]
          guards = [a for a in artifacts if a.get("reason") == "compiler-artifact"
                    and Path(a["manifest_path"]).resolve() == manifest
                    and a["target"]["name"] == "perf_regression"
                    and a["target"]["kind"] == ["test"]
                    and Path(a["target"]["src_path"]).resolve() == root / "crates/runtime_parse/tests/perf_regression.rs"
                    and a["profile"]["test"] and a.get("executable")]
          if len(guards) != 1:
              raise SystemExit("expected one runtime_parse/perf_regression integration-test artifact")
          executable = Path(guards[0]["executable"]).resolve()
          if not executable.is_file() or not executable.is_relative_to(Path(os.environ["CARGO_TARGET_DIR"]).resolve()):
              raise SystemExit("streaming guard executable is outside the isolated head target directory")
          (evidence / "pr-head-guard-executable.txt").write_text(str(executable) + "\n")
          (evidence / "pr-head-guard-artifact.json").write_text(json.dumps(
              {"artifact": guards[0], "sha256": hashlib.sha256(executable.read_bytes()).hexdigest()}, indent=2) + "\n")
          PY
          echo "artifact_binding_seconds=$((SECONDS - phase_started))" >> "$evidence/pr-head-timings.txt"
          PREPARE
          # Execute only the identified artifact, from Cargo's integration-test working directory.
          timeout --kill-after=10s 8m bash -euo pipefail <<'EXECUTE'
          cd "$head_dir/crates/runtime_parse"
          guard=$(cat "$evidence/pr-head-guard-executable.txt")
          phase_started=$SECONDS
          "$guard" runtime_parse_linear_streaming_guard --exact --list --format terse \
            > "$evidence/pr-head-target-selection.txt"
          test "$(cat "$evidence/pr-head-target-selection.txt")" = 'runtime_parse_linear_streaming_guard: test'
          echo "target_selection_seconds=$((SECONDS - phase_started))" >> "$evidence/pr-head-timings.txt"
          phase_started=$SECONDS
          "$guard" runtime_parse_linear_streaming_guard --exact --nocapture --format pretty --color never \
            2>&1 | tee "$evidence/pr-head-guard.log"
          echo "execution_seconds=$((SECONDS - phase_started))" >> "$evidence/pr-head-timings.txt"
          grep -Fx 'test runtime_parse_linear_streaming_guard ... ok' "$evidence/pr-head-guard.log"
          # Other tests in this target may be filtered; exactly one bound test must pass.
          test "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s$' "$evidence/pr-head-guard.log")" = 1
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          EXECUTE
          # Failed preparation/execution retains the worktree and logs for diagnostics.
          phase_started=$SECONDS
          timeout --kill-after=10s 30s git worktree remove "$head_dir"
          echo "worktree_cleanup_seconds=$((SECONDS - phase_started))" >> "$evidence/pr-head-timings.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
      - *source_complete
      - name: Retain streaming qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-1458-head-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ci-1458-evidence/
            target/cargo-timings/
            ${{ runner.temp }}/ci-1458-pr-head-target/cargo-timings/
          retention-days: 14

