name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'qualification/ag4-native-proxy-timing-*'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ag4_proxy_timing:
    name: AG4 native Linux proxy cleanup timing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/qualification/ag4-native-proxy-timing-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify native Ubuntu x86-64 and source identity
        env:
          AG4_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          AG4_TIMING_EVIDENCE="$RUNNER_TEMP/ag4-proxy-timing"
          CARGO_HOME="$RUNNER_TEMP/ag4-proxy-cargo"
          printf 'AG4_TIMING_EVIDENCE=%s\nCARGO_HOME=%s\n' "$AG4_TIMING_EVIDENCE" "$CARGO_HOME" >> "$GITHUB_ENV"
          mkdir -p "$AG4_TIMING_EVIDENCE" "$CARGO_HOME"
          exec > >(tee "$AG4_TIMING_EVIDENCE/environment.log") 2>&1
          printf 'run=%s/%s/actions/runs/%s attempt=%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          printf 'ref=%s event_sha=%s checkout_sha=%s\n' "$GITHUB_REF" "$GITHUB_SHA" "$(git rev-parse HEAD)"
          printf 'runner=%s os=%s arch=%s image=%s image_version=%s\n' "$AG4_RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          uname -a
          cat /etc/os-release
          lscpu
          test "$AG4_RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 24.04
          # Run directly on the existing hosted VM, never in a container/runner wrapper.
          systemd-detect-virt --vm
          if systemd-detect-virt --container; then exit 1; fi
          test ! -e /.dockerenv && test ! -e /run/.containerenv
          test -z "${CARGO_BUILD_TARGET:-}${CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER:-}"
          test ! -e .cargo/config && test ! -e .cargo/config.toml
          test ! -e "$CARGO_HOME/config" && test ! -e "$CARGO_HOME/config.toml"
          test -z "${AWS_ACCESS_KEY_ID:-}${AWS_SECRET_ACCESS_KEY:-}${AWS_SESSION_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          AG4_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$AG4_SOURCE_TREE" | tee "$AG4_TIMING_EVIDENCE/source-tree.txt"
          test "$GITHUB_REF_NAME" = "qualification/ag4-native-proxy-timing-$AG4_SOURCE_TREE"
          printf 'BORROWSER_AG4_SOURCE_TREE=%s\n' "$AG4_SOURCE_TREE" >> "$GITHUB_ENV"

      - name: Build the pinned native command-owner test binary
        run: |
          set -euo pipefail
          rustup show active-toolchain | tee "$AG4_TIMING_EVIDENCE/toolchain.log"
          rustc -vV | tee -a "$AG4_TIMING_EVIDENCE/toolchain.log"
          cargo -vV | tee -a "$AG4_TIMING_EVIDENCE/toolchain.log"
          test "$(rustc -vV | sed -n 's/^release: //p')" = 1.92.0
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          cargo test -p borrowser-conformance --locked --bin borrowser-conformance --no-run \
            2>&1 | tee "$AG4_TIMING_EVIDENCE/build.log"

      - name: Measure the existing native proxy timing scenario
        timeout-minutes: 5
        env:
          BORROWSER_AG4_COMMAND_SCENARIO: proxy-timing
        run: |
          set -euo pipefail
          cargo test -p borrowser-conformance --locked --bin borrowser-conformance \
            aws::command::tests::isolated_owner \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$AG4_TIMING_EVIDENCE/timing.log"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["AG4_TIMING_EVIDENCE"])
          expected = {(mode, sample) for mode in ("natural", "delayed", "term", "kill") for sample in range(8)}
          records = {}
          lines = (evidence / "timing.log").read_text().splitlines()
          for prefix in ("AG4_PROXY_OWNER_TIMING", "AG4_PROXY_TIMING"):
              samples = [json.loads(line.split(prefix + " ", 1)[1]) for line in lines if prefix + " " in line]
              assert len(samples) == 32, (prefix, "incomplete sample count")
              assert {(s["mode"], s["sample"]) for s in samples} == expected, (prefix, "missing/duplicate samples")
              assert all(s["os"] == "linux" and s["arch"] == "x86_64" for s in samples)
              for sample in samples:
                  key = "microseconds_from_cleanup_start" if prefix == "AG4_PROXY_OWNER_TIMING" else "microseconds_from_root_exit_observation"
                  events = sample[key]
                  required = ("cleanup_started", "natural_phase_ended", "stdout_eof", "stderr_eof", "group_quiescence_confirmed",
                              "signaling_complete", "root_reaped", "descendant_reap_started",
                              "descendants_reaped", "owner_quiescent")
                  assert all(name in events for name in required), (prefix, "incomplete authority record")
                  assert all(type(value) is int and value >= 0 for value in events.values())
                  assert events["owner_quiescent"] - events["cleanup_started"] <= 4_000_000, "missing one-second qualification headroom"
                  assert max(events["stdout_eof"], events["stderr_eof"]) <= events["group_quiescence_confirmed"]
                  assert events["group_quiescence_confirmed"] <= events["signaling_complete"] <= events["root_reaped"]
                  assert events["root_reaped"] <= events["descendant_reap_started"] <= events["descendants_reaped"] <= events["owner_quiescent"]
                  assert ("term_sent" in events) == (sample["mode"] in ("term", "kill"))
                  assert ("kill_sent" in events) == (sample["mode"] == "kill")
                  for name in ("group_observation", "term_sent", "kill_sent"):
                      if name in events:
                          assert events[name] <= events["group_quiescence_confirmed"], "post-reap numeric authority"
                  if prefix == "AG4_PROXY_TIMING":
                      assert "root_exit_observed" in events
                      # These are supplementary numeric observations after ownership;
                      # unavailable/reused IDs cannot invalidate production authority.
                      observations = sample["qualification_only_non_authoritative"]
                      assert set(observations) == {"group", "root", "descendant_or_orphan"}
                      assert all(v["status"] in ("numeric_identifier_absent", "unavailable") for v in observations.values())
              records[prefix] = samples
          (evidence / "records.json").write_text(json.dumps(records, indent=2) + "\n")
          PY

      - name: Retain native timing and platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag4-proxy-timing-linux-x86-64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ag4-proxy-timing/
          if-no-files-found: error
          retention-days: 14

  ag4_nonbillable:
    if: ${{ !startsWith(github.ref, 'refs/heads/qualification/ag4-native-proxy-timing-') }}
    name: AG4 credential-free synthesis and snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: invalid-nonbillable-test
      AWS_SECRET_ACCESS_KEY: invalid-nonbillable-test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify qualification source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show -s --format='qualified_commit=%H qualified_tree=%T' HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: python -m pip install --require-hashes -r crates/conformance/aws/requirements.lock
      - run: python -m unittest discover -s crates/conformance/aws/tests -v
      - run: python -m unittest discover -s tools/conformance/tests -v

  ag2_linux_chromium:
    if: ${{ !startsWith(github.ref, 'refs/heads/qualification/ag4-native-proxy-timing-') }}
    name: AG2 Chromium (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: 1
      BORROWSER_CHROMIUM_EXECUTABLE: /opt/borrowser-ag2/chrome-linux64/chrome
      AG2_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AG2_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # pull_request events supply the synthetic integration commit.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record and verify native runner environment
        run: |
          set -euo pipefail
          AG2_EVIDENCE="$RUNNER_TEMP/ag2-evidence"
          echo "AG2_EVIDENCE=$AG2_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$AG2_EVIDENCE" "$RUNNER_TEMP/ag2-build-tmp" "$RUNNER_TEMP/ag2-profiles"
          echo "TMPDIR=$RUNNER_TEMP/ag2-build-tmp" >> "$GITHUB_ENV"
          exec > >(tee "$AG2_EVIDENCE/environment.log") 2>&1
          printf 'run=%s/%s/actions/runs/%s attempt=%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          printf 'event_sha=%s checkout_sha=%s checkout_tree=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
          printf 'pr_head_sha=%s pr_base_sha=%s\n' "$AG2_HEAD_SHA" "$AG2_BASE_SHA"
          git show -s --format='checkout_parents=%P' HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          rustup show active-toolchain
          rustc -vV
          cargo -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          printf 'runner_os=%s runner_arch=%s image=%s image_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          uname -a
          cat /etc/os-release
          lscpu
          id
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 24.04
          # A GitHub-hosted VM is intentional; containers/emulation are not this lane.
          systemd-detect-virt --vm
          if systemd-detect-virt --container; then exit 1; fi
          findmnt -no OPTIONS /proc
          sysctl user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns kernel.yama.ptrace_scope

      - name: Install pinned Chromium runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apparmor libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 \
            libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libexpat1 \
            libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libudev1 \
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxkbcommon0 libxrandr2

      - name: Verify and install the reference archive
        run: |
          set -euo pipefail
          exec > >(tee "$AG2_EVIDENCE/browser-install.log") 2>&1
          manifest=crates/conformance/chromium-reference.json
          cp "$manifest" "$AG2_EVIDENCE/chromium-reference.json"
          version=$(jq -er '.version' "$manifest")
          url=$(jq -er '.archives.linux64.url' "$manifest")
          checksum=$(jq -er '.archives.linux64.sha256' "$manifest")
          test "$url" = "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip"
          archive="$RUNNER_TEMP/ag2-chrome-linux64.zip"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 180 --retry 2 --output "$archive" "$url"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          sha256sum "$archive" | tee "$AG2_EVIDENCE/archive.sha256"
          # Root-owned installation; no arbitrary system browser or setuid helper.
          sudo mkdir /opt/borrowser-ag2
          sudo unzip -q "$archive" -d /opt/borrowser-ag2
          file "$BORROWSER_CHROMIUM_EXECUTABLE"
          "$BORROWSER_CHROMIUM_EXECUTABLE" --version
          # Ubuntu 24.04 restricts unprivileged user namespaces. Permit only
          # this exact pinned executable, without changing global sysctls.
          sudo tee /etc/apparmor.d/borrowser-ag2-chromium > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile borrowser-ag2-chromium /opt/borrowser-ag2/chrome-linux64/chrome flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/borrowser-ag2-chromium
          cat /etc/apparmor.d/borrowser-ag2-chromium
          sudo grep -F 'borrowser-ag2-chromium ' /sys/kernel/security/apparmor/profiles

      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ag2-linux-chromium

      - name: Build and lint conformance tooling
        run: |
          set -euo pipefail
          cargo build -p borrowser-conformance --locked 2>&1 | tee "$AG2_EVIDENCE/build.log"
          cargo clippy -p borrowser-conformance --all-targets --locked -- -D warnings 2>&1 | tee "$AG2_EVIDENCE/clippy.log"

      - name: Qualify native launcher and ownership
        # Cargo/rustc/build scripts retain the build TMPDIR, even on a rebuild.
        # The target runner sets TMPDIR only for test/CLI execution.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: env TMPDIR=${{ runner.temp }}/ag2-profiles
        run: |
          set -euo pipefail
          set +e
          cargo test -p borrowser-conformance --locked native_ -- --nocapture \
            2>&1 | tee "$AG2_EVIDENCE/native.log"
          AG2_NATIVE_PIPE_STATUS=("${PIPESTATUS[@]}")
          set -e
          printf 'cargo_exit=%s tee_exit=%s\n' "${AG2_NATIVE_PIPE_STATUS[0]}" "${AG2_NATIVE_PIPE_STATUS[1]}" > "$AG2_EVIDENCE/native-status.txt"
          # Preserve Cargo's original failure; evidence capture cannot turn it green.
          if test "${AG2_NATIVE_PIPE_STATUS[0]}" -ne 0; then exit "${AG2_NATIVE_PIPE_STATUS[0]}"; fi
          exit "${AG2_NATIVE_PIPE_STATUS[1]}"

      - name: Qualify real Chromium and complete conformance suite
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: env TMPDIR=${{ runner.temp }}/ag2-profiles
        run: |
          set -euo pipefail
          # Ordinary tests own their private child invocations.
          cargo test -p borrowser-conformance --locked -- \
            --test-threads=1 --nocapture 2>&1 | tee "$AG2_EVIDENCE/conformance.log"
          # Each ignored qualification owns a fresh standalone process.
          cargo test -p borrowser-conformance --locked --bin borrowser-conformance \
            chromium::tests::real_chromium_capture_and_scripts \
            -- --exact --ignored --test-threads=1 --nocapture \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo test -p borrowser-conformance --locked --bin borrowser-conformance \
            chromium::tests::real_chromium_lifecycle_and_topology \
            -- --exact --ignored --test-threads=1 --nocapture \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo test -p borrowser-conformance --locked --bin borrowser-conformance \
            comparison::tests::real_chromium_comparison_composition \
            -- --exact --ignored --test-threads=1 --nocapture \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo test -p borrowser-conformance --locked --bin borrowser-conformance \
            chromium::tests::real_chromium_ag5_read_only_inspection \
            -- --exact --ignored --test-threads=1 --nocapture \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo test -p borrowser-conformance --locked --bin borrowser-conformance \
            chromium::tests::real_chromium_ag5_profile \
            -- --exact --ignored --test-threads=1 --nocapture \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo test -p borrowser-conformance --locked --test chromium_cli \
            real_chromium_cli_has_stable_independent_observations \
            -- --exact --ignored --nocapture \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo test -p borrowser-conformance --locked --test comparison_cli \
            real_chromium_combined_cli_is_stable_and_selects_exactly \
            -- --exact --ignored --nocapture \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo test -p borrowser-conformance --locked --bin borrowser-conformance \
            chromium::tests::real_chromium_ag7_inert_links \
            -- --exact --ignored --test-threads=1 --nocapture \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo test -p borrowser-conformance --locked --test comparison_cli \
            real_chromium_ag7_scoped_relationships \
            -- --exact --ignored --nocapture \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          env TMPDIR="$RUNNER_TEMP/ag2-profiles" \
            BORROWSER_AG4_GUEST_HARNESS="$PWD/target/debug/borrowser-conformance" \
            python3 -m unittest discover -s crates/conformance/aws/tests \
              -p test_guest_capture.py \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo test -p borrowser-conformance --locked --test comparison_cli \
            ag8_real_chromium_suites_are_stable \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$AG2_EVIDENCE/conformance.log"
          cargo run -p borrowser-conformance --locked -- --chromium \
            > "$AG2_EVIDENCE/captures.json" 2> "$AG2_EVIDENCE/capture.stderr"
          cargo run -p borrowser-conformance --locked -- --compare canvas/cascade \
            > "$AG2_EVIDENCE/comparison.json" 2> "$AG2_EVIDENCE/comparison.stderr"

      - name: Verify private profile cleanup
        run: |
          set -euo pipefail
          # The Rust owner verifies identities, termination and ECHILD before
          # success. This additional check detects retained failure artifacts.
          find "$RUNNER_TEMP/ag2-profiles" -mindepth 1 -maxdepth 1 -print | tee "$AG2_EVIDENCE/remaining-artifacts.log"
          test ! -s "$AG2_EVIDENCE/remaining-artifacts.log"
          echo 'Native and real-browser tests passed; cleanup verified.' | tee "$AG2_EVIDENCE/result.txt"

      - name: Collect native failure diagnostics
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          AG2_EVIDENCE="$RUNNER_TEMP/ag2-evidence"
          mkdir -p "$AG2_EVIDENCE"
          printf 'Optional summaries: 10 seconds plus 1-second kill grace, 64 KiB each; inventory depth 3.\n' > "$AG2_EVIDENCE/diagnostics.log"
          # Only optional diagnostics are handled here. Required qualification
          # and cleanup steps keep their ordinary failing exit status.
          if timeout --kill-after=1s 10s ps -eo pid,ppid,sid,stat,comm 2>&1 | head -c 65536 > "$AG2_EVIDENCE/processes.txt"; then
            :
          else
            printf 'Process summary unavailable or truncated (exit %s); see processes.txt.\n' "$?" >> "$AG2_EVIDENCE/diagnostics.log"
          fi
          if timeout --kill-after=1s 10s sudo -n journalctl -k --no-pager -n 200 2>&1 | head -c 65536 > "$AG2_EVIDENCE/kernel.log"; then
            :
          else
            printf 'Kernel journal unavailable or truncated (exit %s); see kernel.log.\n' "$?" >> "$AG2_EVIDENCE/diagnostics.log"
          fi
          if test -d "$RUNNER_TEMP/ag2-profiles"; then
            if timeout --kill-after=1s 10s find "$RUNNER_TEMP/ag2-profiles" -maxdepth 3 -type f -printf '%P %s bytes\n' 2>&1 | head -c 65536 > "$AG2_EVIDENCE/profile-files.txt"; then
              :
            else
              printf 'Retained-artifact inventory unavailable or truncated (exit %s); see profile-files.txt.\n' "$?" >> "$AG2_EVIDENCE/diagnostics.log"
            fi
          else
            echo 'No qualification temporary directory exists.' > "$AG2_EVIDENCE/profile-files.txt"
          fi
          # Export only known qualification records. Never copy browser profiles,
          # databases, dumps or other browser-created contents, including hidden files.
          mkdir -p "$RUNNER_TEMP/ag2-upload"
          for name in environment.log browser-install.log chromium-reference.json archive.sha256 \
            build.log clippy.log native.log native-status.txt conformance.log captures.json capture.stderr comparison.json comparison.stderr \
            remaining-artifacts.log result.txt processes.txt kernel.log profile-files.txt; do
            if test -f "$AG2_EVIDENCE/$name"; then
              size=$(wc -c < "$AG2_EVIDENCE/$name")
              case "$name" in
                processes.txt|kernel.log|profile-files.txt)
                  if test "$size" -ge 65536; then
                    printf '%s reached the 64-KiB diagnostic limit; may be truncated.\n' "$name" >> "$AG2_EVIDENCE/diagnostics.log"
                  fi ;;
              esac
              if test "$size" -gt 1048576; then
                printf '%s truncated for upload: retained final 1 MiB of %s bytes.\n' "$name" "$size" >> "$AG2_EVIDENCE/diagnostics.log"
              fi
              # A fixed-size read also bounds logs still growing after cancellation.
              python3 - "$AG2_EVIDENCE/$name" "$RUNNER_TEMP/ag2-upload/$name" <<'PY'
          import os
          import sys
          with open(sys.argv[1], "rb") as source:
              size = os.fstat(source.fileno()).st_size
              if os.path.basename(sys.argv[1]) == "native.log":
                  # Keep causal records even when the native log's tail omits them.
                  # Only complete extraction is acceptable qualification evidence.
                  import json
                  directory = os.path.dirname(sys.argv[2])
                  remaining, retained, complete = size, 0, True
                  with open(os.path.join(directory, "ag41-witness.log"), "wb") as witness:
                      while remaining:
                          line = source.readline(min(8192, remaining))
                          if not line:
                              complete = False
                              break
                          remaining -= len(line)
                          if b"AG41_" in line or b"aws::command::tests::native_procfs_" in line:
                              if retained + len(line) > 1048576 or not line.endswith(b"\n"):
                                  complete = False
                                  break
                              witness.write(line)
                              retained += len(line)
                  with open(os.path.join(directory, "ag41-witness-status.json"), "w") as status:
                      json.dump({"complete": complete and remaining == 0,
                                 "source_bytes": size, "retained_bytes": retained}, status)
              source.seek(max(0, size - 1048576))
              data = source.read(1048576)
          with open(sys.argv[2], "wb") as destination:
              destination.write(data)
          PY
            fi
          done
          cp "$AG2_EVIDENCE/diagnostics.log" "$RUNNER_TEMP/ag2-upload/diagnostics.log"

      - name: Upload AG2 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag2-linux-x86-64-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          path: ${{ runner.temp }}/ag2-upload/

  source_provenance:
    name: Source and provenance
    if: ${{ !startsWith(github.ref, 'refs/heads/qualification/ag4-native-proxy-timing-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RUST_BACKTRACE: 1
    outputs:
      qualified_sha: ${{ steps.qualification_source.outputs.qualified_sha }}
      qualified_tree: ${{ steps.qualification_source.outputs.qualified_tree }}
      pr_head_tree: ${{ steps.qualification_source.outputs.pr_head_tree }}
    steps:
      - &integration_checkout
        name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &integration_identity
        name: Verify integration source identity
        id: source_identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            test "$(git show -s --format=%P HEAD)" = "$PR_BASE_SHA $PR_HEAD_SHA"
            git cat-file -e "$PR_HEAD_SHA^{commit}"
          fi
          git show -s --format='integration_commit=%H integration_tree=%T parents=%P' HEAD
          echo "integration_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - &committed_preflight
        name: Verify checkout and committed subtree history
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B tools/ci/check_dependency_subtrees.py
      - &pinned_toolchain
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # @stable otherwise updates an unused compiler and changes the Cargo cache key.
          toolchain: '1.92.0'
          components: rustfmt, clippy
      - name: Cache cargo (provenance-registry)
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-ci-1458
          key: provenance-registry
          cache-targets: 'false'
          cache-workspace-crates: 'false'
          cache-bin: 'false'
          cache-on-failure: 'false'
      - name: Prepare locked main and fuzz dependency caches
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Verify qualified local URL sources and dependency graphs
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make check-url-dependencies
      - name: Verify qualified ureq source, history and dependency selection
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make check-network-dependencies
      - &source_complete
        name: Verify completed source qualification
        id: qualification_source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "qualified_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "qualified_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            echo "pr_head_tree=$(git rev-parse "$PR_HEAD_SHA^{tree}")" >> "$GITHUB_OUTPUT"
          fi

  rust_correctness:
    name: Rust correctness and parser regressions
    if: ${{ !startsWith(github.ref, 'refs/heads/qualification/ag4-native-proxy-timing-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUST_BACKTRACE: 1
    outputs:
      qualified_sha: ${{ steps.qualification_source.outputs.qualified_sha }}
      qualified_tree: ${{ steps.qualification_source.outputs.qualified_tree }}
    steps:
      - *integration_checkout
      - *integration_identity
      - *committed_preflight
      - &rust_dependencies
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libssl-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libwayland-dev \
            libxkbcommon-dev

      # The shared installer explicitly matches rust-toolchain.toml.
      - *pinned_toolchain
      - name: Cache cargo (workspace-debug)
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-ci-1458
          key: workspace-debug
          cache-targets: 'true'
          cache-workspace-crates: 'false'
          cache-bin: 'false'
          cache-on-failure: 'false'
      - name: Rustfmt (check)
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p browser --all-targets --features conformance-observation --locked -- -D warnings
      - name: Clippy (deny warnings, html5)
        run: cargo clippy --workspace --all-targets --features html5 --locked -- -D warnings
      - name: Clippy (deny warnings, html5 hardening/fuzz)
        run: cargo clippy --workspace --all-targets --features "html5 html5-fuzzing parser-conformance parser_invariants parser-failure-injection" --locked -- -D warnings
      - name: Build (debug, all targets)
        run: cargo build --workspace --all-targets --locked --timings

      - name: Run tests (default HTML5 build)
        # AG4.1's red native qualification runs in the required AG2 native step.
        # Filter only its duplicate wrappers here; keep all other tests enabled.
        run: cargo test --workspace --lib --bins --tests --examples --locked -- --skip aws::command::tests::native_procfs_
      - name: Run tests (explicit html5 feature lane)
        run: cargo test --workspace --lib --bins --tests --examples --features html5 --locked -- --skip aws::command::tests::native_procfs_
      - name: Run canonical HTML parser conformance observations
        run: cargo test -p html --test html5_parser_conformance --features parser-conformance --locked
      - name: Run pinned external HTML parser subset
        run: make test-html5-external-fixtures
      - name: Run typed HTML parser fatal-failure lane
        run: make test-html5-parser-fatal-failures
      - name: Run HTML5 semantic DOM golden fixtures
        run: cargo test -p html --test html5_golden_tree_builder --features "html5 dom-snapshot parser-conformance" --locked
      - name: Run HTML5 patch-log golden fixtures
        run: cargo test -p html --test html5_golden_tree_builder_patches --features html5 --locked
      - name: Run HTML5 smoke corpus
        run: cargo test -p html --test html5_smoke_real_pages --features "html5 dom-snapshot" --locked
      - name: Run promoted rawtext/script regressions
        run: cargo test -p html --test html5_rawtext_script_regressions --features "html5 dom-snapshot parser_invariants" --locked
      - name: Run HTML5 pipeline regression snapshots
        run: cargo test -p html --test html5_pipeline_regressions --features "html5 html5-fuzzing dom-snapshot parser_invariants" --locked
      - name: Run WPT tree-builder slice
        run: cargo test -p html --test wpt_html5_tree_builder --features "html5 dom-snapshot" --locked
      - name: Build (debug, all targets, html5)
        run: cargo build --workspace --all-targets --features html5 --locked --timings
      - name: Check generated HTML entities
        run: make html-entities-check
      - *source_complete
      - name: Retain Cargo compilation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-1458-build-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/cargo-timings/
          if-no-files-found: error
          retention-days: 14

  rust_release:
    name: Release, networking abort and benches
