[package]
name = "borrowser-host-lifecycle"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
publish = false
autotests = false

[workspace]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ring = "0.17.14"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "foundation"
path = "tests/foundation.rs"
