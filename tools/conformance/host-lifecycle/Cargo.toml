[package]
name = "borrowser-host-lifecycle"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
autotests = false

[workspace]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ring = "0.17.14"
libc = "0.2"
zeroize = "1.8"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
base64 = "0.22"
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "foundation"
path = "tests/foundation.rs"
