[package]
name = "borrowser-host-lifecycle"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
publish = false
autotests = false

[workspace]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ring = "0.17.14"
libc = "0.2"

# Exact SDK pins require the complete documented projection audit on every update.
aws-sdk-ec2 = "=1.237.0"
aws-sdk-sts = "=1.107.0"
aws-sdk-s3 = "=1.137.0"
aws-sdk-iam = { version = "=1.113.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-kms = { version = "=1.111.0", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "=1.2.14"
aws-types = "=1.3.16"
aws-smithy-runtime-api = "=1.12.3"
aws-smithy-types = { version = "=1.5.0", features = ["http-body-1-x"] }
aws-smithy-async = "=1.2.14"
aws-smithy-http-client = { version = "=1.1.13", features = ["rustls-aws-lc"] }
base64 = "=0.22.1"
zeroize = { version = "=1.8.1", features = ["serde"] }
bytes = "=1.12.1"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
# Already resolved through the pinned Smithy XML stack; structural presence only.
xmlparser = "=0.13.6"
tokio = { version = "=1.53.1", features = ["rt", "time"] }

[dev-dependencies]
aws-smithy-http-client = { version = "=1.1.13", features = ["test-util"] }
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "test-util"] }
http = "=1.4.2"

tempfile = "3"

[[test]]
name = "foundation"
path = "tests/foundation.rs"

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[[test]]
name = "dispatch"
path = "tests/dispatch.rs"

[[test]]
name = "provider_contracts"
path = "tests/provider_contracts.rs"

[[test]]
name = "provider_v2_contracts"
path = "tests/provider_v2_contracts.rs"

[[test]]
name = "provider_v3_contracts"
path = "tests/provider_v3_contracts.rs"

[[test]]
name = "provider_v4_contracts"
path = "tests/provider_v4_contracts.rs"

[[test]]
name = "provider_v5_contracts"
path = "tests/provider_v5_contracts.rs"
